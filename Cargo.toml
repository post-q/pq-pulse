[package]
name = "pq-pulse"
version = "0.5.0"
edition = "2024"
description = "Post-quantum TLS key-exchange probe with CDN/edge/vendor attribution of the endpoint"
license = "EUPL-1.2"
repository = "https://github.com/post-q/pq-pulse"
readme = "README.md"
rust-version = "1.85"
keywords = ["tls", "post-quantum", "cdn", "cryptography", "network"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
chrono = "0.4"
rustls = "0.23.36"
webpki-roots = "1.0.5"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
indicatif = "0.18"
x509-parser = "0.18"
ipnet = "2"
